<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳长绳时机评价系统</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}

h1 {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  letter-spacing: 3px;
  color: #e94560;
  text-shadow: 0 0 20px rgba(233,69,96,0.5);
}

/* Top Stats Bar */
.top-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  margin: 0 20px 15px 20px;
  flex-wrap: wrap;
}
.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
}
.stat-label { font-size: 11px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }
.stat-value { font-size: 22px; font-weight: bold; }
.stat-value.total { color: #e94560; }
.stat-value.perfect { color: #ffd700; }
.stat-value.good { color: #4ade80; }
.stat-value.miss { color: #f87171; }

/* Main Layout */
.main-row {
  display: flex;
  gap: 15px;
  padding: 0 20px 20px 20px;
  max-width: 1400px;
  margin: 0 auto;
}

.video-box {
  flex: 1;
  position: relative;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  aspect-ratio: 4/3;
}
.input_video { display: none; }
.output_canvas { width: 100%; height: 100%; object-fit: cover; }

.loading {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  text-align: center;
  z-index: 10;
}
.loading.hidden { display: none; }
.spinner {
  width: 40px; height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Score Flash */
.score-flash {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 72px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
  text-shadow: 0 0 40px currentColor;
}
.score-flash.show {
  animation: flashAnim 1.2s ease-out forwards;
}
.score-flash.perfect { color: #ffd700; }
.score-flash.good { color: #4ade80; }
.score-flash.ok { color: #fbbf24; }
.score-flash.miss { color: #f87171; }

@keyframes flashAnim {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
}

/* Rope Zone Indicator */
.rope-zone-indicator {
  position: absolute;
  border: 3px dashed rgba(255,255,255,0.4);
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
}

/* Side Panel */
.side-panel {
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.glass {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 16px;
}

/* Recent Evaluations */
.eval-list {
  max-height: 200px;
  overflow-y: auto;
  font-size: 14px;
}
.eval-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.eval-item:last-child { border-bottom: none; }
.eval-icon { font-size: 18px; }
.eval-name { flex: 1; color: #ddd; }
.eval-score { font-weight: bold; }
.eval-score.perfect { color: #ffd700; }
.eval-score.good { color: #4ade80; }
.eval-score.ok { color: #fbbf24; }
.eval-score.miss { color: #f87171; }
.eval-time { font-size: 11px; color: rgba(255,255,255,0.4); }

/* Config */
.config-grid {
  display: grid;
  gap: 10px;
}
.config-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.config-row label { color: rgba(255,255,255,0.7); min-width: 80px; }
.config-row input[type="range"] { flex: 1; accent-color: #e94560; }
.config-row span { min-width: 40px; text-align: right; font-size: 12px; color: #aaa; }

.input-group { margin-top: 8px; }
.input-group label { display: block; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
.input-group input, .input-group select {
  width: 100%;
  padding: 8px 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
}
.input-group input:focus, .input-group select:focus {
  outline: none;
  border-color: #e94560;
}

/* Buttons */
.action-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.action-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.action-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-start { background: linear-gradient(135deg, #e94560, #d63a54); color: #fff; }
.btn-pause { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #333; }
.btn-reset { background: linear-gradient(135deg, #6b7280, #4b5563); color: #fff; }
.btn-export { background: linear-gradient(135deg, #4ade80, #22c55e); color: #fff; }
.btn-calibrate { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: #fff; }

/* Calibrate overlay */
.calibrate-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 30;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 15px;
}
.calibrate-overlay.show { display: flex; }
.calibrate-text {
  color: #fff;
  font-size: 18px;
  text-align: center;
}
.calibrate-hint {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
}
.calibrate-btn {
  padding: 10px 30px;
  background: #e94560;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}

/* Status bar */
.status-bar {
  text-align: center;
  padding: 8px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
}

/* Scrollbar */
.eval-list::-webkit-scrollbar { width: 4px; }
.eval-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

/* Video select */
.video-select-container {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 15;
}
.video-select {
  padding: 6px 10px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>🏅 跳长绳时机评价系统</h1>

<div class="top-stats">
  <div class="stat-item">
    <span class="stat-label">总跳次</span>
    <span class="stat-value total" id="statTotal">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">精准</span>
    <span class="stat-value perfect" id="statPerfect">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">良好</span>
    <span class="stat-value good" id="statGood">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">一般</span>
    <span class="stat-value ok" id="statOk">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">失误</span>
    <span class="stat-value miss" id="statMiss">0</span>
  </div>
</div>

<div class="main-row">
  <div class="video-box" id="videoBox">
    <video class="input_video" id="inputVideo" playsinline></video>
    <canvas class="output_canvas" id="outputCanvas"></canvas>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>正在加载 AI 模型...</div>
    </div>

    <!-- Score Flash -->
    <div class="score-flash" id="scoreFlash"></div>

    <!-- Calibrate Overlay -->
    <div class="calibrate-overlay" id="calibrateOverlay">
      <div class="calibrate-text">🎯 请点击绳圈中心位置</div>
      <div class="calibrate-hint">用于标定跳绳区域中心</div>
      <button class="calibrate-btn" id="calibrateBtn">确定</button>
    </div>

    <!-- Video Select -->
    <div class="video-select-container">
      <select class="video-select" id="cameraSelect">
        <option value="">选择摄像头...</option>
      </select>
    </div>
  </div>

  <div class="side-panel">
    <div class="glass">
      <div style="font-size:14px; color:#e94560; margin-bottom:10px; font-weight:bold;">📋 最近评价</div>
      <div class="eval-list" id="evalList">
        <div style="color:rgba(255,255,255,0.4); font-size:13px; text-align:center; padding:20px;">
          暂无评价记录
        </div>
      </div>
    </div>

    <div class="glass">
      <div style="font-size:14px; color:#e94560; margin-bottom:10px; font-weight:bold;">⚙️ 设置</div>
      <div class="config-grid">
        <div class="config-row">
          <label>绳子颜色</label>
          <select id="ropeColorSelect" style="flex:1; padding:6px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:#fff; font-size:12px;">
            <option value="red">红色胶带</option>
            <option value="orange">橙色胶带</option>
            <option value="yellow">黄色胶带</option>
            <option value="blue">蓝色胶带</option>
            <option value="green">绿色胶带</option>
          </select>
        </div>
        <div class="config-row">
          <label>灵敏度</label>
          <input type="range" id="sensitivitySlider" min="1" max="10" value="5">
          <span id="sensitivityVal">5</span>
        </div>
        <div class="config-row">
          <label>播报音量</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
          <span id="volumeVal">100%</span>
        </div>
        <div class="config-row">
          <label>播报开关</label>
          <input type="checkbox" id="voiceOn" checked style="width:auto;">
        </div>
        <div class="input-group">
          <label>目标次数</label>
          <input type="number" id="goalInput" value="50" min="1" max="500">
        </div>
      </div>
    </div>

    <div class="glass">
      <div style="font-size:14px; color:#e94560; margin-bottom:10px; font-weight:bold;">🎮 操作</div>
      <div class="action-buttons">
        <button class="action-btn btn-start" id="startBtn">▶ 开始</button>
        <button class="action-btn btn-pause" id="pauseBtn" disabled>⏸ 暂停</button>
      </div>
      <div class="action-buttons" style="margin-top:6px;">
        <button class="action-btn btn-calibrate" id="calibrateMainBtn">🎯 标定区域</button>
        <button class="action-btn btn-reset" id="resetBtn">🔄 重置</button>
      </div>
      <div class="action-buttons" style="margin-top:6px;">
        <button class="action-btn btn-export" id="exportBtn">📥 导出报告</button>
      </div>
    </div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  准备就绪
</div>

<script>
// ============ GLOBALS ============
const videoElement = document.getElementById('inputVideo');
const canvasElement = document.getElementById('outputCanvas');
const canvasCtx = canvasElement.getContext('2d');
const loadingElement = document.getElementById('loading');
const scoreFlash = document.getElementById('scoreFlash');
const calibrateOverlay = document.getElementById('calibrateOverlay');
const calibrateBtn = document.getElementById('calibrateBtn');

let pose = null;
let camera = null;
let isRunning = false;
let isPaused = false;

// Stats
let totalJumps = 0;
let perfectCount = 0;
let goodCount = 0;
let okCount = 0;
let missCount = 0;
let dailyGoal = 50;

// Rope tracking state
let ropeHistory = []; // Recent rope positions for angle calculation
let ropeAngle = 0; // Current rope angle in degrees (0 = bottom)
let ropeCenter = null; // (x, y) of rope circle center
let ropeRadius = 100; // Radius of rope circle in pixels
let lastRopeAngle = 0;
let ropeRotationDirection = 0; // 1 = clockwise, -1 = counter-clockwise
let ropePhase = 0; // accumulated angle for rotation tracking
let lastRopePhase = 0;

// Entry detection state
let personInZone = false;
let lastPersonInZone = false;
let lastEntryTime = 0;
let entryCooldown = 800; // ms between entry detections
let entryCountPerPerson = {}; // track entries per person id

// Settings
let ropeColor = 'red';
let sensitivity = 5;
let volume = 1;
let voiceOn = true;
let synth = window.speechSynthesis;

// Evaluation history
let evalHistory = [];

// Calibration
let isCalibrating = false;

// Person tracking
let personId = 0;
let trackedPersons = {};

// Rope color ranges in HSV
const ROPE_COLORS = {
  red: { hLow: 0, hHigh: 15, sMin: 100, vMin: 100 },    // Red/Orange
  orange: { hLow: 10, hHigh: 30, sMin: 100, vMin: 100 }, // Orange
  yellow: { hLow: 25, hHigh: 45, sMin: 80, vMin: 80 },   // Yellow
  blue: { hLow: 90, hHigh: 130, sMin: 80, vMin: 60 },  // Blue
  green: { hLow: 45, hHigh: 85, sMin: 80, vMin: 60 }   // Green
};

// ============ CAMERA INIT ============
async function loadCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    const select = document.getElementById('cameraSelect');
    select.innerHTML = '<option value="">选择摄像头...</option>';
    videoDevices.forEach((dev, i) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = dev.label || `摄像头 ${i + 1}`;
      select.appendChild(opt);
    });
    if (videoDevices.length > 0) {
      select.selectedIndex = 1;
    }
  } catch (e) {
    console.error('Failed to enumerate devices:', e);
  }
}

async function startCamera(deviceId) {
  if (camera) {
    camera.stop();
    camera = null;
  }

  const constraints = {
    video: deviceId
      ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
      : { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
  };

  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    videoElement.srcObject = stream;
    await videoElement.play();

    // Resize canvas to match video
    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;

    // Start pose
    initPose();
  } catch (e) {
    console.error('Camera error:', e);
    document.getElementById('statusBar').textContent = '摄像头启动失败: ' + e.message;
  }
}

function initPose() {
  pose = new Pose({
    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  camera = new Camera(videoElement, {
    onFrame: async () => {
      if (!isPaused) {
        await pose.send({ image: videoElement });
      }
    },
    width: videoElement.videoWidth || 1280,
    height: videoElement.videoHeight || 720
  });

  camera.start();
  loadingElement.classList.add('hidden');
  document.getElementById('statusBar').textContent = '系统就绪，请先标定跳绳区域';
}

// ============ CALIBRATION ============
function startCalibration() {
  isCalibrating = true;
  calibrateOverlay.classList.add('show');
  canvasElement.style.cursor = 'crosshair';
}

function cancelCalibration() {
  isCalibrating = false;
  calibrateOverlay.classList.remove('show');
  canvasElement.style.cursor = 'default';
}

function doCalibrate(e) {
  if (!isCalibrating) return;

  const rect = canvasElement.getBoundingClientRect();
  const scaleX = canvasElement.width / rect.width;
  const scaleY = canvasElement.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  ropeCenter = { x, y };
  ropeRadius = Math.min(canvasElement.width, canvasElement.height) * 0.2; // default 20% of smaller dimension

  isCalibrating = false;
  calibrateOverlay.classList.remove('show');
  canvasElement.style.cursor = 'default';
  document.getElementById('statusBar').textContent = `已标定：中心(${Math.round(x)}, ${Math.round(y)}) 半径${Math.round(ropeRadius)}px`;

  speak('已标定跳绳区域，开始评价吧');
}

// ============ ROPE TRACKING ============
function trackRope(frame) {
  if (!ropeCenter) return null;

  // Draw frame to canvas
  canvasCtx.save();
  canvasCtx.drawImage(frame, 0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.restore();

  // Get rope color range
  const colorDef = ROPE_COLORS[ropeColor];

  // Quick check: sample points around the rope circle
  // Look for color that matches rope tape
  const samplePoints = 36;
  let foundPoints = [];
  let ropeImgData;

  // Use a simplified approach: scan the image for colored pixels
  // First get canvas image data
  ropeImgData = canvasCtx.getImageData(0, 0, canvasElement.width, canvasElement.height);

  // Find pixels matching the rope color
  for (let y = 0; y < canvasElement.height; y += 4) {
    for (let x = 0; x < canvasElement.width; x += 4) {
      const idx = (y * canvasElement.width + x) * 4;
      const r = ropeImgData.data[idx];
      const g = ropeImgData.data[idx + 1];
      const b = ropeImgData.data[idx + 2];

      if (isColorMatch(r, g, b, colorDef)) {
        foundPoints.push({ x, y });
      }
    }
  }

  // If not enough points, return last known angle
  if (foundPoints.length < 10) {
    // Try to use rope center + rope angle to estimate positions
    return {
      angle: lastRopeAngle,
      confidence: 0
    };
  }

  // Find the two endpoints of the rope
  // The rope should form an arc - find the two farthest points
  let minDist = Infinity;
  let bestPt1 = null, bestPt2 = null;

  for (let i = 0; i < foundPoints.length; i++) {
    for (let j = i + 1; j < foundPoints.length; j++) {
      const dx = foundPoints[i].x - foundPoints[j].x;
      const dy = foundPoints[i].y - foundPoints[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Check if this pair is roughly on the rope circle
      const midX = (foundPoints[i].x + foundPoints[j].x) / 2;
      const midY = (foundPoints[i].y + foundPoints[j].y) / 2;
      const distFromCenter = Math.sqrt(
        Math.pow(midX - ropeCenter.x, 2) +
        Math.pow(midY - ropeCenter.y, 2)
      );

      // Accept if roughly passing through the rope circle
      if (dist > 50 && Math.abs(distFromCenter - ropeRadius) < ropeRadius * 0.5) {
        if (dist < minDist) {
          minDist = dist;
          bestPt1 = foundPoints[i];
          bestPt2 = foundPoints[j];
        }
      }
    }
  }

  if (!bestPt1 || !bestPt2) {
    return { angle: lastRopeAngle, confidence: 0 };
  }

  // Calculate rope angle
  // The rope spans from bestPt1 to bestPt2
  // We want the angle of the rope relative to horizontal
  const ropeDx = bestPt2.x - bestPt1.x;
  const ropeDy = bestPt2.y - bestPt1.y;

  // Calculate angle from center to midpoint
  const midX = (bestPt1.x + bestPt2.x) / 2;
  const midY = (bestPt1.y + bestPt2.y) / 2;

  // Angle from center to midpoint (where rope is)
  let angle = Math.atan2(midY - ropeCenter.y, midX - ropeCenter.x);
  angle = angle * 180 / Math.PI;

  // Normalize to 0-360
  if (angle < 0) angle += 360;

  // Determine rotation direction
  let deltaAngle = angle - lastRopeAngle;

  // Handle wrap-around
  if (deltaAngle > 180) deltaAngle -= 360;
  if (deltaAngle < -180) deltaAngle += 360;

  // Track accumulated phase
  ropePhase += deltaAngle;

  // Determine if clockwise or counter-clockwise
  // If phase is increasing, rope is rotating
  let direction = deltaAngle > 0 ? 1 : deltaAngle < 0 ? -1 : ropeRotationDirection;

  lastRopeAngle = angle;
  ropeRotationDirection = direction;

  // Draw rope on canvas for debugging (optional)
  drawRope(bestPt1, bestPt2);

  return {
    angle: angle,
    direction: direction,
    phase: ropePhase,
    confidence: Math.min(foundPoints.length / 100, 1),
    pt1: bestPt1,
    pt2: bestPt2
  };
}

function isColorMatch(r, g, b, def) {
  // Convert RGB to HSV
  const hsv = rgbToHsv(r, g, b);
  const h = hsv.h, s = hsv.s, v = hsv.v;

  // Check hue
  let hueMatch = false;
  if (def.hLow < def.hHigh) {
    hueMatch = h >= def.hLow && h <= def.hHigh;
  } else {
    hueMatch = h >= def.hLow || h <= def.hHigh;
  }

  return hueMatch && s >= def.sMin / 255 && v >= def.vMin / 255;
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, v = max;
  const d = max - min;
  s = max === 0 ? 0 : d / max;

  if (max === min) {
    h = 0;
  } else {
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: h * 360, s: s * 255, v: v * 255 };
}

function drawRope(pt1, pt2) {
  if (!pt1 || !pt2) return;

  // Draw rope line
  canvasCtx.save();
  canvasCtx.beginPath();
  canvasCtx.moveTo(pt1.x, pt1.y);
  canvasCtx.lineTo(pt2.x, pt2.y);
  canvasCtx.strokeStyle = '#ffff00';
  canvasCtx.lineWidth = 4;
  canvasCtx.stroke();

  // Draw detected points
  canvasCtx.fillStyle = '#ffff00';
  [pt1, pt2].forEach(pt => {
    canvasCtx.beginPath();
    canvasCtx.arc(pt.x, pt.y, 6, 0, 2 * Math.PI);
    canvasCtx.fill();
  });
  canvasCtx.restore();
}

// ============ POSE DETECTION ============
function onResults(results) {
  if (!isRunning || isPaused) return;

  // Process frame for rope
  const ropeData = trackRope(results.image);

  // Draw skeleton
  canvasCtx.save();
  canvasCtx.scale(-1, 1);
  canvasCtx.translate(-canvasElement.width, 0);
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

  if (results.poseLandmarks) {
    // Draw pose landmarks
    drawPose(results.poseLandmarks);

    // Detect entry
    detectEntry(results.poseLandmarks, ropeData);
  }

  canvasCtx.restore();

  // Draw rope circle indicator
  drawRopeZone();
}

function drawPose(landmarks) {
  const connections = [
    [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Arms
    [11, 23], [12, 24], [23, 24], // Torso
    [23, 25], [25, 27], [24, 26], [26, 28] // Legs
  ];

  canvasCtx.save();
  // Mirror the drawing
  canvasCtx.scale(-1, 1);
  canvasCtx.translate(-canvasElement.width, 0);

  // Draw connections
  canvasCtx.strokeStyle = '#4ade80';
  canvasCtx.lineWidth = 3;
  connections.forEach(([i, j]) => {
    const p1 = landmarks[i];
    const p2 = landmarks[j];
    if (p1 && p2) {
      canvasCtx.beginPath();
      canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
      canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
      canvasCtx.stroke();
    }
  });

  // Draw ankle points (for entry detection)
  canvasCtx.fillStyle = '#e94560';
  [27, 28].forEach(i => {
    const p = landmarks[i];
    if (p) {
      canvasCtx.beginPath();
      canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 8, 0, 2 * Math.PI);
      canvasCtx.fill();
    }
  });

  canvasCtx.restore();
}

function drawRopeZone() {
  if (!ropeCenter) return;

  canvasCtx.save();
  canvasCtx.beginPath();
  canvasCtx.arc(ropeCenter.x, ropeCenter.y, ropeRadius, 0, 2 * Math.PI);
  canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  canvasCtx.lineWidth = 2;
  canvasCtx.setLineDash([10, 5]);
  canvasCtx.stroke();
  canvasCtx.restore();
}

// ============ ENTRY DETECTION ============
function detectEntry(landmarks, ropeData) {
  if (!ropeCenter || !ropeData || ropeData.confidence < 0.3) return;

  // Get ankle positions (mirrored - scale -1, translate)
  const leftAnkle = landmarks[27];
  const rightAnkle = landmarks[28];

  if (!leftAnkle || !rightAnkle) return;

  // Mirror x coordinate
  const leftAnkleX = (1 - leftAnkle.x) * canvasElement.width;
  const leftAnkleY = leftAnkle.y * canvasElement.height;
  const rightAnkleX = (1 - rightAnkle.x) * canvasElement.width;
  const rightAnkleY = rightAnkle.y * canvasElement.height;

  // Calculate foot center position
  const footX = (leftAnkleX + rightAnkleX) / 2;
  const footY = (leftAnkleY + rightAnkleY) / 2;

  // Check if foot is inside rope zone
  const distFromCenter = Math.sqrt(
    Math.pow(footX - ropeCenter.x, 2) +
    Math.pow(footY - ropeCenter.y, 2)
  );

  // person in zone if foot center is within rope radius
  const wasInZone = personInZone;
  personInZone = distFromCenter < ropeRadius;

  // Entry detection: was outside, now inside
  if (personInZone && !wasInZone) {
    const now = Date.now();
    if (now - lastEntryTime > entryCooldown) {
      lastEntryTime = now;
      evaluateEntry(ropeData);
    }
  }
}

function evaluateEntry(ropeData) {
  // Rope angle: 0 = bottom of circle (best), 180 = top (worst)
  // Entry is best when rope is at bottom (angle close to 0 or 360)
  let angle = ropeData.angle;

  // Normalize angle: we want to measure deviation from bottom (0)
  // If angle > 180, rope is on the "wrong" side
  let deviation = angle;
  if (deviation > 180) deviation = 360 - deviation;

  // Calculate score
  let score, label, cls;

  if (deviation <= 20) {
    score = 100 - deviation;
    label = '精准';
    cls = 'perfect';
    perfectCount++;
    totalJumps++;
  } else if (deviation <= 45) {
    score = 100 - deviation;
    label = '良好';
    cls = 'good';
    goodCount++;
    totalJumps++;
  } else if (deviation <= 70) {
    score = 100 - deviation;
    label = '一般';
    cls = 'ok';
    okCount++;
    totalJumps++;
  } else {
    score = Math.max(0, 50 - (deviation - 70));
    label = '失误';
    cls = 'miss';
    missCount++;
    totalJumps++;
  }

  // Update UI
  updateStats();
  showScoreFlash(label, score, cls);
  addEvalItem(label, score, cls);
  playVoice(label, score);

  // Check goal
  if (totalJumps === dailyGoal) {
    speak('恭喜达成目标！共跳了' + dailyGoal + '次！');
  }
}

// ============ UI UPDATES ============
function updateStats() {
  document.getElementById('statTotal').textContent = totalJumps;
  document.getElementById('statPerfect').textContent = perfectCount;
  document.getElementById('statGood').textContent = goodCount;
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statMiss').textContent = missCount;
}

function showScoreFlash(label, score, cls) {
  scoreFlash.textContent = label + ' ' + score;
  scoreFlash.className = 'score-flash ' + cls + ' show';
  setTimeout(() => {
    scoreFlash.className = 'score-flash';
  }, 1200);
}

function addEvalItem(label, score, cls) {
  const list = document.getElementById('evalList');
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);

  // Remove placeholder if exists
  if (list.querySelector('div[style]')) {
    list.innerHTML = '';
  }

  const icons = { perfect: '🏆', good: '✅', ok: '⚠️', miss: '❌' };
  const item = document.createElement('div');
  item.className = 'eval-item';
  item.innerHTML = `
    <span class="eval-icon">${icons[cls]}</span>
    <span class="eval-name">${time}</span>
    <span class="eval-score ${cls}">${label} (${score}分)</span>
  `;

  list.insertBefore(item, list.firstChild);

  // Keep only last 50
  while (list.children.length > 50) {
    list.removeChild(list.lastChild);
  }
}

function playVoice(label, score) {
  if (!voiceOn || !synth) return;

  synth.cancel();
  const utter = new SpeechSynthesisUtterance();
  utter.text = label + '，' + score + '分';
  utter.volume = volume;
  utter.rate = 1.1;
  utter.lang = 'zh-CN';
  synth.speak(utter);
}

function speak(text) {
  if (!voiceOn || !synth) return;
  synth.cancel();
  const utter = new SpeechSynthesisUtterance();
  utter.text = text;
  utter.volume = volume;
  utter.rate = 1.0;
  utter.lang = 'zh-CN';
  synth.speak(utter);
}

// ============ EXPORT ============
function exportReport() {
  if (evalHistory.length === 0 && totalJumps === 0) {
    alert('暂无数据可导出');
    return;
  }

  let report = `=== 跳长绳评价报告 ===\n`;
  report += `导出时间：${new Date().toLocaleString()}\n`;
  report += `目标次数：${dailyGoal}\n`;
  report += `------------------------\n`;
  report += `统计数据：\n`;
  report += `  总跳次：${totalJumps}\n`;
  report += `  精准：${perfectCount}次\n`;
  report += `  良好：${goodCount}次\n`;
  report += `  一般：${okCount}次\n`;
  report += `  失误：${missCount}次\n`;

  if (totalJumps > 0) {
    const accuracy = Math.round((perfectCount + goodCount) / totalJumps * 100);
    report += `  优良率：${accuracy}%\n`;
  }

  report += `------------------------\n`;

  if (evalHistory.length > 0) {
    report += `详细记录：\n`;
    evalHistory.forEach((e, i) => {
      report += `  ${i + 1}. [${e.time}] ${e.label} - ${e.score}分\n`;
    });
  }

  const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `跳绳评价报告_${new Date().toLocaleDateString().replace(/\//g, '-')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============ RESET ============
function resetSession() {
  if (!confirm('确定要重置所有数据吗？')) return;

  totalJumps = 0;
  perfectCount = 0;
  goodCount = 0;
  okCount = 0;
  missCount = 0;
  evalHistory = [];
  ropePhase = 0;
  lastRopePhase = 0;
  lastEntryTime = 0;
  personInZone = false;
  lastPersonInZone = false;

  updateStats();
  document.getElementById('evalList').innerHTML = `
    <div style="color:rgba(255,255,255,0.4); font-size:13px; text-align:center; padding:20px;">
      暂无评价记录
    </div>
  `;
  document.getElementById('statusBar').textContent = '已重置';
}

// ============ EVENT LISTENERS ============
document.getElementById('cameraSelect').addEventListener('change', function() {
  if (this.value) {
    startCamera(this.value);
  }
});

document.getElementById('sensitivitySlider').addEventListener('input', function() {
  sensitivity = parseInt(this.value);
  document.getElementById('sensitivityVal').textContent = sensitivity;
  // Higher sensitivity = lower threshold for color detection
  entryCooldown = 1200 - sensitivity * 100;
});

document.getElementById('volumeSlider').addEventListener('input', function() {
  volume = parseFloat(this.value);
  document.getElementById('volumeVal').textContent = Math.round(volume * 100) + '%';
});

document.getElementById('voiceOn').addEventListener('change', function() {
  voiceOn = this.checked;
});

document.getElementById('goalInput').addEventListener('change', function() {
  dailyGoal = parseInt(this.value) || 50;
});

document.getElementById('ropeColorSelect').addEventListener('change', function() {
  ropeColor = this.value;
});

document.getElementById('startBtn').addEventListener('click', function() {
  if (!ropeCenter) {
    alert('请先标定跳绳区域！');
    startCalibration();
    return;
  }
  isRunning = true;
  isPaused = false;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('statusBar').textContent = '评价进行中...';
  speak('开始');
});

document.getElementById('pauseBtn').addEventListener('click', function() {
  isPaused = !isPaused;
  this.textContent = isPaused ? '▶ 继续' : '⏸ 暂停';
  document.getElementById('statusBar').textContent = isPaused ? '已暂停' : '评价进行中...';
});

document.getElementById('resetBtn').addEventListener('click', resetSession);
document.getElementById('exportBtn').addEventListener('click', exportReport);

document.getElementById('calibrateMainBtn').addEventListener('click', startCalibration);
document.getElementById('calibrateBtn').addEventListener('click', cancelCalibration);

canvasElement.addEventListener('click', doCalibrate);

// ============ INIT ============
window.onload = async () => {
  await loadCameras();
  // Try to start default camera
  const select = document.getElementById('cameraSelect');
  if (select.options.length > 1) {
    // Will start after user selects or we auto-select
  }

  // Load voices
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = () => {};
  }

  document.getElementById('statusBar').textContent = '请选择摄像头并标定跳绳区域';
};

// Auto-start camera if only one available
navigator.mediaDevices.enumerateDevices().then(devices => {
  const videoDevices = devices.filter(d => d.kind === 'videoinput');
  if (videoDevices.length === 1) {
    startCamera(videoDevices[0].deviceId);
  } else if (videoDevices.length > 1) {
    // Auto-select the back/environment camera if available
    const backCamera = videoDevices.find(d =>
      d.label.toLowerCase().includes('back') ||
      d.label.toLowerCase().includes('rear') ||
      d.label.toLowerCase().includes('environment')
    );
    if (backCamera) {
      startCamera(backCamera.deviceId);
    }
  }
});
</script>
